<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{ titulo }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Martian+Mono:wght@400;500;600&family=Onest:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/static/cerebro.css">
</head>
<body>
<!-- corpo:inicio -->
<canvas id="cena" aria-hidden="true"></canvas>
<div class="veu" aria-hidden="true"></div>

<div class="app">
  <nav class="trilho" aria-label="Seções">
    <a class="marca" href="#conversar" aria-label="Cérebro Comercial, voltar para a conversa">
      <span class="marca-orbe" data-orbe="mini"></span>
      <b>CITi</b>
    </a>
    <div class="nav">
      <a href="#conversar" data-tela="conversar">
        <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v7a2.5 2.5 0 0 1-2.5 2.5H10l-4.5 4v-4A2.5 2.5 0 0 1 4 13.5z"/><path d="M8.5 9.5h7M8.5 12.5h4"/></svg>
        <span>Conversar</span>
      </a>
      <a href="#registrar" data-tela="registrar">
        <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/><path d="M18 15.5v4M16 17.5h4"/></svg>
        <span>Registrar</span>
      </a>
      <a href="#fila" data-tela="fila">
        <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13l2.5-7.5h11L20 13v5.5A1.5 1.5 0 0 1 18.5 20h-13A1.5 1.5 0 0 1 4 18.5z"/><path d="M4 13h4.5l1.5 2.5h4l1.5-2.5H20"/></svg>
        <span>Fila</span>
        <b class="contador" id="contador-fila" hidden>0</b>
      </a>
      <a href="#fontes" data-tela="fontes">
        <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4l8 4-8 4-8-4z"/><path d="M4 12l8 4 8-4"/><path d="M4 16l8 4 8-4"/></svg>
        <span>Fontes</span>
      </a>
      <a href="#playbook" data-tela="playbook">
        <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5.5A1.5 1.5 0 0 1 6.5 4H19v14H6.5A1.5 1.5 0 0 0 5 19.5z"/><path d="M5 19.5A1.5 1.5 0 0 0 6.5 21H19"/><path d="M9 8h6M9 11h4"/></svg>
        <span>Playbook</span>
      </a>
      <a href="#briefing" data-tela="briefing">
        <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg>
        <span>Briefing</span>
      </a>
    </div>
  </nav>

  <main class="principal">
    <header class="topo vidro">
      <div class="ident" id="ident"></div>
      <div class="acoes">
        <span class="modo" id="modo" data-modo="demo">Conectando…</span>
        <div class="voce">
          <label for="autor">Você</label>
          <input id="autor" autocomplete="name" placeholder="Seu nome" maxlength="100">
        </div>
      </div>
    </header>

    <div class="telas">
      <section class="tela tela-conversar" data-tela="conversar" aria-label="Conversar com o Cérebro">
        <div class="conversa">
          <div class="mensagens" id="mensagens" aria-live="polite"></div>
          <form class="doca" id="form-chat">
            <div class="entrada">
              <a class="btn-icone" href="#registrar" title="Registrar um insight" aria-label="Registrar um insight">
                <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
              </a>
              <label class="sr" for="campo-chat">Sua pergunta</label>
              <textarea class="campo-msg" id="campo-chat" rows="1" maxlength="4000" placeholder="Pergunte ao Cérebro…"></textarea>
              <button class="enviar" id="enviar-chat" type="submit" aria-label="Enviar pergunta">
                <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 11.5L20 4l-6.5 16-2.5-6.5z"/><path d="M11 13.5L20 4"/></svg>
              </button>
            </div>
            <div class="atalhos" id="atalhos-chat"></div>
          </form>
        </div>
        <aside class="palco" aria-label="O que o Cérebro sabe hoje">
          <div class="orbe-grande" data-orbe="grande"></div>
          <div class="ficha vidro">
            <h2>O que eu sei hoje</h2>
            <div class="numeros">
              <div><b id="n-playbook">0</b><span>no playbook</span></div>
              <div><b id="n-fila">0</b><span>na fila</span></div>
              <div><b id="n-hipoteses">0</b><span>hipóteses abertas</span></div>
              <div><b id="n-fontes">0</b><span>páginas lidas</span></div>
            </div>
            <p class="rodape" id="rodape-base"></p>
          </div>
        </aside>
      </section>

      <section class="tela tela-registrar" data-tela="registrar" aria-label="Registrar um insight" hidden>
        <div class="painel vidro registrar-chat">
          <div class="cab">
            <span class="av" data-orbe="mini"></span>
            <div><h2>Curador</h2><p>Organiza o seu relato e pergunta o que faltou</p></div>
          </div>
          <div class="mensagens" id="mensagens-reg" aria-live="polite"></div>
          <form class="doca" id="form-reg">
            <div class="entrada">
              <label class="sr" for="campo-reg">O que aconteceu</label>
              <textarea class="campo-msg" id="campo-reg" rows="1" maxlength="8000" placeholder="Conte o que aconteceu…"></textarea>
              <button class="enviar" id="enviar-reg" type="submit" aria-label="Enviar relato">
                <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 11.5L20 4l-6.5 16-2.5-6.5z"/><path d="M11 13.5L20 4"/></svg>
              </button>
            </div>
          </form>
        </div>
        <form class="painel vidro rascunho" id="rascunho" novalidate aria-label="Rascunho do item"></form>
      </section>

      <section class="tela tela-lista" data-tela="fila" aria-label="Fila de curadoria" hidden>
        <div class="lista" id="lista-fila"></div>
      </section>

      <section class="tela tela-lista" data-tela="fontes" aria-label="Fontes importadas" hidden>
        <div id="fontes-conteudo"></div>
      </section>

      <section class="tela tela-lista" data-tela="playbook" aria-label="Playbook" hidden>
        <div class="funil vidro" id="funil" role="group" aria-label="Filtrar por etapa do funil"></div>
        <div class="filtros" id="filtros"></div>
        <div id="grupos"></div>
      </section>

      <section class="tela tela-lista" data-tela="briefing" aria-label="Briefing de reunião" hidden>
        <form class="painel vidro briefing-form" id="form-briefing">
          <div class="campo">
            <label for="b-segmento">Segmento</label>
            <select id="b-segmento"></select>
          </div>
          <div class="campo">
            <label for="b-tipo">Reunião</label>
            <select id="b-tipo">
              <option value="diagnostico">Diagnóstico</option>
              <option value="proposta" selected>Proposta</option>
              <option value="negociacao">Negociação</option>
            </select>
          </div>
          <div class="campo contexto">
            <label for="b-contexto">Contexto</label>
            <textarea id="b-contexto" rows="2" maxlength="600">Rede com 6 hotéis no litoral, reclamam de fila no check-in na alta temporada.</textarea>
          </div>
          <button class="btn primario" type="submit">Montar briefing</button>
        </form>
        <div id="briefing-saida"></div>
      </section>
    </div>
  </main>
</div>

<div class="fundo-gaveta" id="fundo-gaveta" hidden></div>
<aside class="gaveta" id="gaveta" aria-label="Detalhe do item" aria-hidden="true" inert>
  <button class="btn-icone fechar" id="fechar-gaveta" type="button" aria-label="Fechar">
    <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <div id="gaveta-corpo"></div>
</aside>
<div class="torradas" id="torradas" aria-live="polite"></div>
<!-- corpo:fim -->
<script src="/static/cerebro.js" defer></script>
</body>
</html>
