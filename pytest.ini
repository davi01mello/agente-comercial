[pytest]
pythonpath = .
testpaths = tests
# O golden set (tests/golden) chama o Gemini de verdade: fica fora do `pytest` normal e do CI.
# Para rodar: pytest -m live tests/golden   (o -m da linha de comando vale mais que o daqui)
addopts = -m "not live"
markers =
    live: chama o Gemini de verdade (gasta cota); rode com pytest -m live
