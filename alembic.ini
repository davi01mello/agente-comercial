# Configuração do Alembic (migrações do banco).
# A URL do banco NÃO fica aqui: vem do .env (DATABASE_URL) e é lida em migrations/env.py.
# Comandos do dia a dia:
#   alembic upgrade head                              aplica todas as migrações pendentes
#   alembic revision --autogenerate -m "descrição"    gera uma migração a partir de app/models.py
#   alembic check                                     falha se models.py e migrações divergem

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
# Nome dos arquivos: data + id + descrição (fica fácil ver a ordem no explorador)
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
